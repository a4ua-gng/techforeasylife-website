<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1d"><title>TEL OS · Employee Workspace</title><style>
:root{color-scheme:dark;--bg:#090e1d;--surface:#10192b;--surface2:#17223a;--line:#26344e;--text:#f3f6fe;--muted:#98a8c3;--blue:#4e9dff;--aqua:#65dbca;--gold:#facf88;--red:#ff7c88;--green:#69deb0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 110% 50% at 30% -20%,#162b55 1%,transparent 75%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);line-height:1.4}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:disabled{opacity:.48;cursor:not-allowed}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(445px,100%);padding:38px;background:linear-gradient(150deg,#162440,#0d1527);border:1px solid #304466;border-radius:24px;box-shadow:0 28px 100px #0007}.logo{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:800;letter-spacing:.12em}.logomark{width:48px;height:44px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#266bb9,#59b8fa);font-size:24px;letter-spacing:-.12em;font-weight:900;color:white}.auth h1{font-size:29px;letter-spacing:-.04em;line-height:1.1;margin:34px 0 12px}.muted{color:var(--muted)}.auth .muted{margin-bottom:28px}.label{font-size:12px;font-weight:700;color:#aec0da;display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}input,select,textarea{width:100%;background:#0b1425;border:1px solid #34435c;border-radius:11px;padding:12px;color:#f4f6ff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3f9bff20}textarea{min-height:90px;resize:vertical}form .field{margin:0 0 16px}.btn{border:1px solid #385377;border-radius:11px;background:#192c49;color:var(--text);font-weight:700;padding:10px 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}.btn:hover{background:#233c62}.btn.primary{background:linear-gradient(110deg,#327acb,#387ce2);border-color:#4c9aff}.btn.primary:hover{filter:brightness(1.15)}.btn.danger{border-color:#a34b60;color:#ffb6bf}.btn.small{padding:7px 11px;font-size:12px}.btn.full{width:100%}.footnote{font-size:12px;color:#7489ab}.error{color:#ffadb5;background:#64273640;border:1px solid #804255;padding:10px 12px;border-radius:10px;font-size:13px;margin:12px 0}.success{color:#a6f7dc;background:#114b3e70;padding:10px 12px;border-radius:10px;margin:12px 0;font-size:13px}.app{display:flex;min-height:100vh}.sidebar{width:244px;flex-shrink:0;padding:27px 16px;border-right:1px solid var(--line);background:#0d1425;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.sidebar .logo{padding:0 12px 28px}.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#6f82a4;margin:24px 12px 12px;font-weight:800}.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;border:0;width:100%;border-radius:11px;color:#98aac9;background:transparent;font-weight:650;font-size:13px;margin:2px 0}.nav .sym{font-size:18px;width:22px;text-align:center}.nav:hover{color:white;background:#182640}.nav.active{background:linear-gradient(90deg,#183969,#142944);color:#fff;border:1px solid #284d7c}.profile-mini{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.avatar{border-radius:12px;width:39px;height:39px;background:linear-gradient(140deg,#4275bd,#22407a);display:grid;place-items:center;font-weight:800;color:#e2f3ff}.profile-name{font-size:12px;font-weight:750}.profile-role{font-size:11px;color:var(--muted);text-transform:capitalize}.main{flex:1;min-width:0;padding:28px clamp(18px,3.6vw,64px) 60px;max-width:1700px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid #233149}.eyebrow{color:var(--aqua);font-weight:700;letter-spacing:.12em;font-size:10px;text-transform:uppercase}.topbar h1{font-size:29px;margin:5px 0 0;letter-spacing:-.045em}.topright{display:flex;align-items:center;gap:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#5b728e}.dot.online{background:var(--green);box-shadow:0 0 0 4px #69deb021}.pill{font-size:11px;color:#b5c6e0;padding:6px 10px;border:1px solid #314765;border-radius:100px;display:inline-flex;align-items:center;gap:8px;background:#142339}.grid{display:grid;gap:18px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin:28px 0}.card{border:1px solid #273957;border-radius:17px;background:linear-gradient(145deg,#121d32,#11192b);padding:22px;min-width:0}.kpi .klabel{font-size:12px;color:#94a9c7}.kpi .value{font-size:30px;font-weight:800;letter-spacing:-.055em;margin-top:15px}.kpi .hint{font-size:11px;color:#7e96b6;margin-top:8px}.kpi i{display:inline-grid;place-items:center;border:1px solid #294d64;background:#122d46;width:34px;height:34px;border-radius:10px;font-style:normal;float:right}.twocol{grid-template-columns:1.45fr 1fr}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.section-head h2{margin:0;font-size:16px;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:12px;margin-top:3px}.worktimer{font-size:44px;letter-spacing:-.045em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;margin:25px 0 14px}.progress{background:#233550;height:8px;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#348ad3,#68ddcf);border-radius:20px;transition:width .25s}.buttonrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.tag{padding:4px 9px;font-size:10px;letter-spacing:.025em;border-radius:20px;background:#183653;color:#9fccff;border:1px solid #2d5a83;font-weight:700;white-space:nowrap}.tag.green{color:#9bffcf;background:#16392e;border-color:#225f48}.tag.amber{color:#ffdfa1;background:#44351b;border-color:#71572e}.tag.red{color:#ffacb4;background:#4d2532;border-color:#783849}.tag.dim{background:#1d2a3d;border-color:#35465e;color:#afbfce}.list{display:flex;flex-direction:column;gap:11px}.task{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;border:1px solid #273b58;border-radius:12px;padding:15px;background:#121e32}.task .title{font-weight:750;font-size:13px}.task .meta{color:#8ca1c1;font-size:11px;margin-top:6px;line-height:1.6}.task .controls{display:flex;gap:7px;align-items:center}.empty{color:#8ba1c0;font-size:13px;border:1px dashed #334965;border-radius:12px;padding:23px;text-align:center}.callout{border:1px solid #2c5066;background:linear-gradient(110deg,#143347,#172943);border-radius:15px;padding:17px;display:flex;align-items:flex-start;gap:13px;font-size:13px;color:#c4e5ee}.callout strong{color:#d6fbfb}.tablewrap{overflow:auto;border-radius:12px;border:1px solid #283b55}table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}thead{background:#1b2b43}th{text-align:left;color:#9fb5d2;font-weight:800;font-size:11px;padding:13px}td{padding:13px;border-top:1px solid #263650;color:#c8d5e8}td strong{color:white}td .btn{margin-right:5px}h3{font-size:14px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .wide{grid-column:1/-1}.content{padding-top:26px}.statusboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.person{border:1px solid #2c405b;border-radius:13px;padding:16px;background:#142139}.person-head{display:flex;align-items:center;gap:10px}.person h3{margin:0;font-size:12px}.person .role{font-size:10px;color:#9bacc7}.person small{display:block;margin-top:14px;color:#859bb9}.note{font-size:11px;color:#7790b3;margin-top:12px}.notice{border-left:3px solid #eab66f;padding:11px 14px;background:#45341845;color:#eed8b4;font-size:12px;border-radius:0 10px 10px 0;margin-top:14px}.modalback{position:fixed;inset:0;background:#040813c4;z-index:20;display:grid;place-items:center;padding:20px;backdrop-filter:blur(6px)}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#142239;border:1px solid #456183;border-radius:18px;padding:25px;box-shadow:0 25px 100px #000b}.modal h2{margin:0 0 20px;font-size:21px}.toast{position:fixed;bottom:22px;right:24px;background:#214969;border:1px solid #45799f;color:white;z-index:40;padding:13px 20px;border-radius:12px;box-shadow:0 10px 40px #0009;font-weight:700;font-size:12px}.mobile-head{display:none}.steps{display:grid;gap:12px}.step{display:flex;gap:14px;border:1px solid #29405d;border-radius:14px;padding:15px;background:#142139}.step>span{border-radius:50%;background:#2a5480;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:800}.step strong{display:block;font-size:13px}.step p{font-size:12px;color:#9cafcb;margin:5px 0 0}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.statusboard{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.sidebar{position:fixed;z-index:15;transform:translateX(-110%);transition:.2s;box-shadow:15px 0 80px #0009}.sidebar.open{transform:none}.mobile-head{display:block}.main{padding:18px 16px 60px}.topbar h1{font-size:22px}.topright .pill{display:none}.kpis{gap:10px;margin:18px 0}.card{padding:17px}.kpi .value{font-size:24px}.statusboard{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.task{flex-direction:column}.task .controls{width:100%}.topbar{align-items:flex-start}.worktimer{font-size:37px}}
</style></head><body><div id="root"></div><div id="toast" class="toast hidden"></div><div id="modal" class="modalback hidden"></div><script>
const root=document.getElementById('root');let S={user:null,data:null,tab:'overview',loading:false};let interval=null;const e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const fmt=n=>Math.floor(n/3600000).toString().padStart(2,'0')+':'+Math.floor(n%3600000/60000).toString().padStart(2,'0')+':'+Math.floor(n%60000/1000).toString().padStart(2,'0');const date=n=>n?new Date(n).toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'Asia/Kolkata'}):'—';const time=n=>n?new Date(n).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}):'—';const count=(arr,fn)=>arr.filter(fn).length;const role=r=>({founder:'Founder',hr:'Human Resources',lead:'Team Lead',employee:'Team Member'}[r]||r);const allowed=()=>['founder','hr','lead'].includes(S.user?.role);const hr=()=>['founder','hr'].includes(S.user?.role);const name=id=>S.data?.users?.find(x=>x.id===id)?.name||'Unassigned';const client=id=>S.data?.clients?.find(x=>x.id===id)?.name||'Internal';const today=()=>new Date(Date.now()+19800000).toISOString().slice(0,10);const online=x=>x.active&&Date.now()-x.last_seen<100000;const state=x=>!x.active?'Suspended':online(x)?'Online':'Offline';
async function api(path,method='GET',body){const res=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let j={};try{j=await res.json()}catch{}if(!res.ok){if(res.status===401){S.user=null;S.data=null;renderLogin()}if(res.status===428){S.user=S.user||{force_reset:true};renderChangePassword()}throw Error(j.error||'Request failed')}return j}
function showToast(m,err=false){const el=document.getElementById('toast');el.textContent=m;el.style.background=err?'#723044':'#214969';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3800)}
function formField(label,id,type='text',extra=''){return `<div class="field"><label class="label" for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${extra}></div>`}
function logo(){return '<div class="logo"><div class="logomark">TL</div><div>TEL <span style="color:#86aed6">/ OS</span><div style="font-size:9px;color:#8ea7cc;letter-spacing:.12em">WORKSPACE V0.1</div></div></div>'}
function renderLogin(){root.innerHTML=`<main class="auth"><section class="auth-card">${logo()}<h1>Work, with clarity.</h1><p class="muted">Secure employee access to TEL Operations. Your workday, assignments and approvals in one place.</p><form id="loginForm">${formField('Employee login','username','text','autocomplete="username" required')}${formField('Password','password','password','autocomplete="current-password" required')}<div id="loginError"></div><button class="btn primary full">Sign in to TEL OS →</button></form><p class="footnote" style="margin-top:22px">Invite-only demo · HR issues employee credentials · All activity is work-related and visible to authorized managers.</p></section></main>`}
function renderChangePassword(){root.innerHTML=`<main class="auth"><section class="auth-card">${logo()}<h1>Set a private password</h1><p class="muted">HR issued a one-time password. Choose a new password (12 characters minimum) before continuing.</p><form id="resetForm">${formField('Temporary password','old_password','password','required')}${formField('New password','new_password','password','minlength="12" required')}<button class="btn primary full">Activate my workspace</button></form><p class="footnote" style="margin-top:20px">Never send your permanent password over WhatsApp.</p><button class="btn small" id="signOutReset" style="margin-top:14px">Sign out</button></section></main>`}
function navItems(){return [{id:'overview',icon:'▦',title:'Overview'},{id:'tasks',icon:'☷',title:'Assignments'},{id:'attendance',icon:'◷',title:'Attendance'},{id:'team',icon:'◎',title:'Team status'},{id:'meetings',icon:'▣',title:'Meetings & calls'},{id:'leave',icon:'◇',title:'Student leave'},{id:'hr',icon:'♧',title:'HR control',hide:!hr()},{id:'policy',icon:'⚑',title:'Work policy'}]}
function layout(){const pages={overview:'Overview',tasks:'Assignments',attendance:'Attendance',team:'Live team',meetings:'Meetings & calls',leave:'Student leave',hr:'HR control',policy:'Company policy'};root.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar">${logo()}<div class="navgroup">Operations</div>${navItems().filter(x=>!x.hide).map(x=>`<button class="nav ${S.tab===x.id?'active':''}" data-tab="${x.id}"><span class="sym">${x.icon}</span>${x.title}</button>`).join('')}<div class="profile-mini"><div class="avatar">${e(S.user?.name?.slice(0,1)||'T')}</div><div style="flex:1;min-width:0"><div class="profile-name">${e(S.user?.name)}</div><div class="profile-role">${e(role(S.user?.role))}</div></div><button class="btn small" data-act="logout" title="Log out">↪</button></div></aside><main class="main"><div class="topbar"><div><button class="btn small mobile-head" data-act="menu">☰ Menu</button><div class="eyebrow">EMPLOYEE OPERATIONS / TEL GROUP</div><h1>${pages[S.tab]}</h1></div><div class="topright"><span class="pill"><span class="dot online"></span> Signed in securely</span><div class="avatar">${e(S.user?.name?.slice(0,1)||'T')}</div></div></div><section class="content" id="content"></section></main></div>`;paintContent()}
const card=(title,subtitle,body,right='')=>`<section class="card"><div class="section-head"><div><h2>${title}</h2>${subtitle?`<div class="subtitle">${subtitle}</div>`:''}</div>${right}</div>${body}</section>`;
const badge=(s)=>`<span class="tag ${s==='done'||s==='approved'||s==='Online'||s==='answered'?'green':s==='high'||s==='working'||s==='pending'?'amber':s==='missed'||s==='declined'||s==='Suspended'?'red':'dim'}">${e(s)}</span>`;
function kpi(title,value,hint,icon){return `<div class="card kpi"><i>${icon}</i><div class="klabel">${title}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function activeMs(){const d=S.data;let ms=d?.todayMs||0, a=d?.activeSession;if(a){ms-=Math.max(0,((a.end_at||d.now)-a.start_at-(a.break_ms||0)-(a.state==='break'?(d.now-a.break_started_at):0)));if(a.state==='working')ms+=Math.max(0,Date.now()-a.start_at-(a.break_ms||0));else ms+=Math.max(0,a.break_started_at-a.start_at-(a.break_ms||0))}return Math.max(0,ms)}
function timerSection(){const d=S.data,a=d.activeSession,ms=activeMs(),pc=Math.min(100,ms/14400000*100);return card('Your work session','Target: up to 4 scheduled hours, with required breaks',`<div class="worktimer" id="workTime">${fmt(ms)}</div><div class="progress"><div id="workBar" style="width:${pc}%"></div></div><div class="buttonrow">${!a?'<button class="btn primary" data-act="clock-in">▶ Clock in</button>':a.state==='working'?'<button class="btn" data-act="clock-break">Ⅱ Take break</button><button class="btn primary" data-act="clock-out">■ Clock out</button>':'<button class="btn primary" data-act="clock-resume">▶ Resume</button><button class="btn" data-act="clock-out">■ Clock out</button>'}</div><p class="note">${a?'Current status: '+e(a.state)+'. ':'Not currently on duty. '}Attendance records approved work periods, not personal device activity.</p><div class="notice">For students under 18: no overtime or out-of-hours duties; take legally required rest breaks. Managers must approve your schedule.</div>`) }
function taskRow(t){const can=allowed()||t.assignee_id===S.user.id;return `<div class="task"><div><div class="title">${e(t.title)}</div><div class="meta">${e(client(t.client_id))} · ${e(name(t.assignee_id))} · Due ${e(t.due_date||'not set')} · ${e(t.priority)} priority</div>${t.details?`<div class="meta">${e(t.details)}</div>`:''}</div><div class="controls">${badge(t.status)} ${can?`<select data-task="${e(t.id)}" aria-label="Update task status" style="width:112px;padding:8px;font-size:11px"><option value="">Update</option>${['todo','working','review','done'].filter(s=>allowed()||s!=='done').map(s=>`<option>${s}</option>`).join('')}</select>`:''}</div></div>`}
function taskSection(short=false){const t=S.data.tasks;return card(short?'Priority assignments':'Client work & deliverables',short?'Task status updates help managers review progress':'Only designated managers can approve a final deliverable',`<div class="list">${(short?t.filter(x=>x.status!=='done').slice(0,4):t).map(taskRow).join('')||'<div class="empty">No assigned tasks. Ask your manager for a documented brief.</div>'}</div>`,allowed()?'<button class="btn small" data-modal="task">+ Assign task</button>':'')}
function overview(){const d=S.data, mine=d.tasks.filter(x=>x.assignee_id===S.user.id), work=d.sessions.filter(x=>x.work_date===today());return `<div class="callout"><span style="font-size:26px">✦</span><div><strong>Welcome back, ${e(S.user.name.split(' ')[0])}.</strong> Your shift begins when you clock in. Meetings and work calls count toward your scheduled work time. Approved school commitments always come first.</div></div><div class="grid kpis">${kpi('Open assignments',mine.filter(x=>x.status!=='done').length,'Waiting on your next update','☷')}${kpi('Pending review',mine.filter(x=>x.status==='review').length,'Manager approval needed','◇')}${kpi('Online colleagues',d.users.filter(online).length,'Seen in the last 100 seconds','◎')}${kpi('Today logged',fmt(activeMs()).slice(0,5),'Working time excluding pauses','◷')}</div><div class="grid twocol">${timerSection()}${taskSection(true)}</div><div style="margin-top:18px">${card('Delivery pulse','Results matter more than keeping a screen open',`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px">${kpi('Approved tasks',d.tasks.filter(x=>x.status==='done').length,'Review completed','✓')}${kpi('Upcoming meetings',d.meetings.filter(x=>new Date(x.starts_at).getTime()>Date.now()).length,'Agenda-first','▣')}${kpi('Open leave requests',d.leaves.filter(x=>x.status==='pending').length,'HR review pending','◇')}</div>`)}</div>`}
function attendance(){const rows=S.data.sessions.slice().sort((a,b)=>b.start_at-a.start_at);return `<div class="grid twocol">${timerSection()}${card('How the timer works','Clearly recorded, no background surveillance',`<div class="steps">${[['1','Clock in','Begin a scheduled work block.'],['2','Take a break','Pause work time; required student breaks are protected.'],['3','Clock out','End the shift; time is added to the daily total.'],['4','Handover','Move completed work into review and notify the lead.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}</div><div style="margin-top:18px">${card('Recent attendance','Managers can review sessions; only your own attendance is shown to you',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Date</th><th>Clock in</th><th>Clock out</th><th>Work logged</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${e(name(s.user_id))}</td><td>${e(s.work_date)}</td><td>${time(s.start_at)}</td><td>${time(s.end_at)}</td><td>${fmt((s.end_at||Date.now())-s.start_at-(s.break_ms||0)-(s.state==='break'?Date.now()-s.break_started_at:0))}</td><td>${badge(s.state)}</td></tr>`).join('')||'<tr><td colspan="6">No work sessions yet.</td></tr>'}</tbody></table></div>`)}</div>`}
function taskPage(){return `<div class="callout"><span>📋</span><div><strong>Assignment rules</strong> · Every task has a deliverable, due date and owner. Employees submit work for review; leads approve the final result. Chat messages alone don't count as delivery.</div></div><div style="margin-top:18px">${taskSection()}</div>`}
function teamPage(){const users=hr()||S.user.role==='lead'?S.data.users:S.data.users.filter(x=>x.active);return `${card('Team availability','Presence means recent portal activity; it does not mean an employee is continuously working',`<div class="statusboard">${users.map(x=>`<div class="person"><div class="person-head"><div class="avatar">${e(x.name[0])}</div><div><h3>${e(x.name)}</h3><div class="role">${e(role(x.role))}</div></div><span style="margin-left:auto" class="dot ${online(x)?'online':''}"></span></div><small>${badge(state(x))} · ${x.is_minor?'Student safeguards':'Adult eligible'}</small></div>`).join('')}</div><p class="note">Heartbeat only while TEL OS is open. WhatsApp status and private calls are not monitored.</p>`)}`}
function meetingsPage(){const d=S.data;return `<div class="grid twocol">${card('Scheduled meetings','Every meeting has a specific deliverable or decision',`<div class="list">${d.meetings.map(m=>`<div class="task"><div><div class="title">${e(m.topic)}</div><div class="meta">${e(m.objective)} · ${e(m.starts_at)} · Owner: ${e(name(m.owner_id))}</div></div>${badge('agenda set')}</div>`).join('')||'<div class="empty">No meetings scheduled</div>'}</div>`,allowed()?'<button class="btn small" data-modal="meeting">+ Schedule</button>':'')}${card('Work call register','Employees log official calls; no personal calls are recorded automatically',`<div class="list">${d.calls.slice(0,8).map(c=>`<div class="task"><div><div class="title">${e(name(c.user_id))} · ${e(client(c.client_id))}</div><div class="meta">${e(c.notes||'Official call')} · ${date(c.logged_at)} ${time(c.logged_at)}</div></div>${badge(c.status)}</div>`).join('')||'<div class="empty">No official calls logged</div>'}</div>`,'<button class="btn small" data-modal="call">+ Log call</button>')}</div>`}
function leavePage(){const d=S.data;return `${card('School & examination leave','School obligations are a legitimate scheduling consideration',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Dates</th><th>Reason</th><th>Status</th><th>HR action</th></tr></thead><tbody>${d.leaves.map(l=>`<tr><td>${e(name(l.user_id))}</td><td>${e(l.start_date)} to ${e(l.end_date)}</td><td>${e(l.reason)}</td><td>${badge(l.status)}</td><td>${hr()&&l.status==='pending'?`<button class="btn small" data-leave="${e(l.id)}" data-decision="approved">Approve</button><button class="btn small" data-leave="${e(l.id)}" data-decision="declined">Decline</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">No requests</td></tr>'}</tbody></table></div>`,'<button class="btn small" data-modal="leave">+ Request leave</button>')}<div class="notice">Three missed scheduled shifts without notice should create an HR case. TEL OS does not automatically suspend students for illness, exams, technical problems or emergencies.</div>`}
function hrPage(){if(!hr())return '<div class="empty">HR authorization required</div>';return `${card('Employee directory','HR provisions accounts, controls access, and privately shares one-time passwords',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Login</th><th>Role</th><th>Status</th><th>Control</th></tr></thead><tbody>${S.data.users.map(x=>`<tr><td><strong>${e(x.name)}</strong></td><td>${e(x.username)}</td><td>${e(role(x.role))}</td><td>${badge(x.active?'Active':'Suspended')}</td><td>${x.id===S.user.id?'You':`<button class="btn small ${x.active?'danger':''}" data-employee="${e(x.id)}" data-active="${x.active?0:1}">${x.active?'Suspend':'Reactivate'}</button>`}</td></tr>`).join('')}</tbody></table></div>`,'<button class="btn small primary" data-modal="employee">+ Create employee</button>')}<div class="grid twocol" style="margin-top:18px">${card('Accountability alerts','Rule-based alerts, not AI judgments',`<div class="steps">${S.data.tasks.filter(t=>t.due_date&&t.due_date<today()&&t.status!=='done').slice(0,7).map(t=>`<div class="step"><span>!</span><div><strong>${e(t.title)}</strong><p>Overdue · ${e(name(t.assignee_id))} · Manager must review actual circumstances</p></div></div>`).join('')||'<div class="empty">No overdue tasks detected</div>'}</div><p class="note">Absence alerts require published schedules and approved-leave checks before they can be automated.</p>`)}${card('HR protocols','Never share private employee data in the public repository',`<div class="steps">${[['✓','Onboarding','HR creates unique login + temporary password.'],['↺','Review','Confirm the circumstances before responding to missed shifts.'],['🔒','Suspension','Human-approved access control only; sessions are revoked.'],['♧','Student protection','No out-of-hours minor coverage; document approved leave.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}</div>`}
function policyPage(){return `${card('TEL · Company operating policy','Demo policy draft · Requires local legal review before adoption',`<div class="steps">${[['1','Scheduled four-hour target','Complete approved assignments within a lawful, student-compatible roster. Time includes meetings and official calls.'],['2','Formal work communication','Use TEL OS, assigned WhatsApp work channels and company email. No obligation to monitor personal messages.'],['3','Proof of delivery','Each task records assignee, deadline, work product and manager approval.'],['4','Respect for student time','Exam leave, illness, weekly rest and statutory break intervals are protected.'],['5','Three-shift HR review','Consecutive unexplained missed scheduled shifts trigger welfare outreach and a human review, not automatic punishment.'],['6','Emergency duty','₹500+ allowance under a written, bounded roster for consenting eligible adults only; no minor overtime.'],['7','Transparent oversight','Only workplace records are tracked: sign-in, tasks, official call logs and attendance. No covert device surveillance.'],['8','AI readiness','Rule-based flags are live. Third-party AI analysis, WhatsApp integration and automatic call collection are NOT enabled in this demo.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}`}
function paintContent(){const el=document.getElementById('content');if(!el||!S.data)return;const pages={overview,attendance,tasks:taskPage,team:teamPage,meetings:meetingsPage,leave:leavePage,hr:hrPage,policy:policyPage};el.innerHTML=(pages[S.tab]||overview)();tick()}
function tick(){const el=document.getElementById('workTime');if(el)el.textContent=fmt(activeMs());const bar=document.getElementById('workBar');if(bar)bar.style.width=Math.min(100,activeMs()/14400000*100)+'%'}
async function refresh(keep=true){try{const d=await api('/bootstrap');S.data=d;S.user=d.user;if(d.user.force_reset){renderChangePassword();return}if(!keep)S.tab='overview';layout()}catch(err){if(S.user)showToast(err.message,true)}}
function modal(title,content){document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h2>${title}</h2><button class="btn small" data-act="close-modal">✕ Close</button></div>${content}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function opts(list,field,label){return list.map(x=>`<option value="${e(x.id)}">${e(x[label])}</option>`).join('')}
function modalByType(type){let content='';if(type==='task')content=`<form id="taskForm"><div class="field"><label class="label">Deliverable name</label><input name="title" required maxlength="120" placeholder="e.g. Approved launch reel"></div><div class="field"><label class="label">Brief & quality criteria</label><textarea name="details" placeholder="Format, review process, output link..."></textarea></div><div class="formgrid"><div class="field"><label class="label">Employee</label><select name="assignee_id" required>${opts(S.data.users.filter(x=>x.active),'id','name')}</select></div><div class="field"><label class="label">Client</label><select name="client_id">${opts(S.data.clients,'id','name')}</select></div><div class="field"><label class="label">Due date</label><input type="date" name="due_date"></div><div class="field"><label class="label">Estimated minutes</label><input type="number" name="estimated_min" min="15" max="480" value="60"></div><div class="field"><label class="label">Priority</label><select name="priority"><option>normal</option><option>high</option><option>low</option></select></div></div><button class="btn primary full">Assign task</button></form>`;if(type==='employee')content=`<form id="employeeForm"><div class="field"><label class="label">Full name</label><input name="name" required></div><div class="field"><label class="label">Login username</label><input name="username" pattern="[a-zA-Z0-9._-]{3,60}" required></div><div class="field"><label class="label">Role</label><select name="role"><option value="employee">Employee</option><option value="lead">Team Lead</option><option value="hr">Human Resources</option>${S.user.role==='founder'?'<option value="founder">Founder</option>':''}</select></div><div class="field"><label><input type="checkbox" name="is_minor" checked style="width:auto"> Under 18 (student safeguards)</label></div><button class="btn primary full">Generate login + one-time password</button></form>`;if(type==='leave')content=`<form id="leaveForm"><div class="formgrid"><div class="field"><label class="label">From</label><input type="date" name="start_date" required></div><div class="field"><label class="label">To</label><input type="date" name="end_date" required></div></div><div class="field"><label class="label">Reason</label><textarea name="reason" required placeholder="Examinations, school, illness or personal commitment"></textarea></div><button class="btn primary full">Submit to HR</button></form>`;if(type==='meeting')content=`<form id="meetingForm"><div class="field"><label class="label">Meeting topic</label><input name="topic" required></div><div class="field"><label class="label">Specific goal / decision</label><textarea name="objective" required></textarea></div><div class="field"><label class="label">Date & time</label><input type="datetime-local" name="starts_at" required></div><button class="btn primary full">Schedule meeting</button></form>`;if(type==='call')content=`<form id="callForm"><div class="field"><label class="label">Client</label><select name="client_id">${opts(S.data.clients,'id','name')}</select></div><div class="field"><label class="label">Outcome</label><select name="status"><option value="answered">Answered</option><option value="returned">Returned call</option><option value="missed">Missed call</option></select></div><div class="field"><label class="label">Work notes</label><textarea name="notes" placeholder="Business-related summary; no private content"></textarea></div><button class="btn primary full">Record official call</button></form>`;modal(({task:'Assign client work',employee:'Provision new TEL account',leave:'Request student leave',meeting:'Set a goal-based meeting',call:'Log an official work call'})[type],content)}
document.addEventListener('click',async ev=>{let tab=ev.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;layout();document.getElementById('sidebar').classList.remove('open');return}let m=ev.target.closest('[data-modal]');if(m){modalByType(m.dataset.modal);return}let b=ev.target.closest('[data-act]');if(b){let action=b.dataset.act;try{if(action==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(action==='close-modal'){closeModal();return}if(action==='logout'||action==='signOutReset'){await api('/logout','POST',{});S.user=null;S.data=null;renderLogin();return}if(action.startsWith('clock-')){await api('/clock','POST',{action:action.slice(6)});await refresh();showToast('Attendance updated');return}}catch(ex){showToast(ex.message,true)}}let l=ev.target.closest('[data-leave]');if(l){try{await api('/leave/'+l.dataset.leave,'PATCH',{status:l.dataset.decision});await refresh();showToast('Leave decision saved')}catch(ex){showToast(ex.message,true)}}let emp=ev.target.closest('[data-employee]');if(emp){const active=emp.dataset.active==='1';if(!confirm(`HR review: ${active?'reactivate':'suspend'} this account?`))return;try{await api('/employees/'+emp.dataset.employee+'/status','PATCH',{active});await refresh();showToast('Employee access updated')}catch(ex){showToast(ex.message,true)}}});
document.addEventListener('change',async ev=>{const t=ev.target.closest('[data-task]');if(!t||!t.value)return;try{await api('/tasks/'+t.dataset.task,'PATCH',{status:t.value});await refresh();showToast('Task status updated')}catch(ex){showToast(ex.message,true)}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['loginForm','resetForm','taskForm','employeeForm','leaveForm','meetingForm','callForm'].includes(form.id))return;ev.preventDefault();const data=Object.fromEntries(new FormData(form).entries());try{let r;if(form.id==='loginForm'){r=await api('/login','POST',data);S.user=r.user;if(r.user.force_reset)renderChangePassword();else await refresh(false);return}if(form.id==='resetForm'){await api('/change-password','POST',data);showToast('New password saved');await refresh(false);return}if(form.id==='taskForm')r=await api('/tasks','POST',data);if(form.id==='employeeForm'){data.is_minor=form.querySelector('[name="is_minor"]').checked;r=await api('/employees','POST',data);modal('Employee credentials · show once',`<div class="success">Account created. Give these details privately to the employee.</div><label class="label">Username</label><p style="font-size:19px;font-weight:800">${e(r.username)}</p><label class="label">Temporary password</label><p style="font-family:monospace;font-size:17px;word-break:break-all">${e(r.temporary_password)}</p><p class="note">Password must be changed at first login. Never post these details in an open group or repository.</p><button class="btn primary" data-act="close-modal">Done</button>`);await refresh();return}if(form.id==='leaveForm')r=await api('/leave','POST',data);if(form.id==='meetingForm')r=await api('/meetings','POST',data);if(form.id==='callForm')r=await api('/calls','POST',data);closeModal();await refresh();showToast('Saved successfully')}catch(ex){if(form.id==='loginForm'){const el=document.getElementById('loginError');if(el)el.innerHTML=`<div class="error">${e(ex.message)}</div>`}else showToast(ex.message,true)}});
(async()=>{try{const r=await api('/me');S.user=r.user;if(r.user.force_reset)renderChangePassword();else await refresh(false)}catch{renderLogin()}})();
setInterval(()=>{tick();if(S.user&&!S.user.force_reset)api('/heartbeat','POST',{}).catch(()=>{})},45000);
setInterval(()=>{if(S.user&&!S.user.force_reset)refresh().catch(()=>{})},90000);
</script></body></html>
