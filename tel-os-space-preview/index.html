const mkid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(D_NOW()+Math.random());
const D_DAY=()=>new Date(Date.now()+19800000).toISOString().slice(0,10);

  current:'founder',
  users:[
   {id:'u-founder',name:'Aarav Kapoor',username:'demo.founder',role:'founder',is_minor:1,active:1,last_seen:now-8000,force_reset:0},
   {id:'u-hr',name:'Rhea Mehta',username:'demo.hr',role:'hr',is_minor:0,active:1,last_seen:now-13000,force_reset:0},

   {id:'u-designer',name:'Maya Sen',username:'demo.employee',role:'employee',is_minor:1,active:1,last_seen:now-39000,force_reset:0},
   {id:'u-editor',name:'Arjun Das',username:'demo.editor',role:'employee',is_minor:1,active:1,last_seen:now-990000,force_reset:0},
   {id:'u-ops',name:'Sara Khan',username:'demo.ops',role:'employee',is_minor:0,active:1,last_seen:now-18000,force_reset:0}
  ],

  tasks:[
   {id:mkid(),client_id:'skgroup',title:'Homepage animation concept',details:'Premium motion concept + prototype for stakeholder review',assignee_id:'u-founder',status:'working',priority:'high',due_date:day,estimated_min:120,created_at:now-1200000},
   {id:mkid(),client_id:'montra',title:'Showroom launch social reel',details:'30-second vertical cut, captions and export',assignee_id:'u-designer',status:'review',priority:'high',due_date:day,estimated_min:180,created_at:now-1400000},
   {id:mkid(),client_id:'royalenfield',title:'Campaign storyboard',details:'6-frame storyboard and mood references',assignee_id:'u-editor',status:'todo',priority:'normal',due_date:day,estimated_min:100,created_at:now-1600000},
   {id:mkid(),client_id:'skgroup',title:'Weekly content calendar',details:'Copy, timing and asset handover',assignee_id:'u-founder',status:'review',priority:'normal',due_date:day,estimated_min:90,created_at:now-1800000},
   {id:mkid(),client_id:'montra',title:'Brand typography system',details:'Approved templates for three campaign sizes',assignee_id:'u-founder',status:'done',priority:'normal',due_date:day,estimated_min:140,created_at:now-2000000}
  ],
  sessions:[{id:mkid(),user_id:'u-founder',work_date:day,start_at:now-16500000,end_at:now-9900000,break_started_at:null,break_ms:900000,state:'finished',updated_at:now-9900000},{id:mkid(),user_id:'u-designer',work_date:day,start_at:now-9500000,end_at:now-6900000,break_started_at:null,break_ms:0,state:'finished',updated_at:now-6900000}],
  leaves:[{id:mkid(),user_id:'u-editor',start_date:day,end_date:day,reason:'School examination',status:'pending',created_at:now-220000}],
  meetings:[{id:mkid(),topic:'SK Group creative review',objective:'Approve hero animation and homepage direction',starts_at:new Date(now+9000000).toISOString(),owner_id:'u-founder',created_at:now-50000}],
  calls:[{id:mkid(),user_id:'u-founder',client_id:'skgroup',status:'answered',notes:'Reviewed homepage content and timelines',logged_at:now-3700000}],
  activeSession:null
}}
let MOCK=(()=>{try{let s=JSON.parse(localStorage.getItem(DEMO_KEY));return s&&s.users?s:fixtures()}catch{return fixtures()}})();
function persistDemo(){try{localStorage.setItem(DEMO_KEY,JSON.stringify(MOCK))}catch{}}
function bootMock(){let u=MOCK.users.find(x=>x.id===MOCK.current);if(!u||!u.active)throw Error('Please select a demo role');let sess=MOCK.sessions;return {user:{...u},users:MOCK.users,clients:MOCK.clients,tasks:MOCK.tasks,leaves:MOCK.leaves,meetings:MOCK.meetings,calls:MOCK.calls,sessions:sess,activeSession:MOCK.activeSession?.user_id===u.id?MOCK.activeSession:null,todayMs:sess.filter(s=>s.user_id===u.id&&s.work_date===D_DAY()).reduce((a,s)=>a+(s.end_at||D_NOW())-s.start_at-(s.break_ms||0),0),now:D_NOW(),today:D_DAY()}}
async function api(path,method='GET',body={}){
 let u=MOCK.users.find(x=>x.id===MOCK.current),now=D_NOW();
 if(path==='/me'){if(!u)throw Error('Login required');return {user:u}}
 if(path==='/login'){let chosen=MOCK.users.find(x=>x.username===body.username);if(!chosen)throw Error('In this preview, use one of the demo accounts below.');MOCK.current=chosen.id;chosen.last_seen=now;persistDemo();return {user:chosen}}
 if(path==='/logout'){MOCK.current=null;persistDemo();return {ok:true}}
 if(!u)throw Error('Sign in first');
 if(path==='/bootstrap')return bootMock();
 if(path==='/heartbeat'){u.last_seen=now;persistDemo();return {ok:true}}
 if(path==='/clock'){
  let a=MOCK.activeSession; if(body.action==='in'){if(a)throw Error('Already clocked in');MOCK.activeSession={id:mkid(),user_id:u.id,work_date:D_DAY(),start_at:now,end_at:null,break_ms:0,break_started_at:null,state:'working',updated_at:now};}
  else if(body.action==='break'){if(!a||a.state!=='working')throw Error('Not working');a.state='break';a.break_started_at=now;}
  else if(body.action==='resume'){if(!a||a.state!=='break')throw Error('Not on break');a.break_ms+=now-a.break_started_at;a.break_started_at=null;a.state='working';}
  else if(body.action==='out'){if(!a)throw Error('Not clocked in');if(a.state==='break'){a.break_ms+=now-a.break_started_at;a.break_started_at=null}a.state='finished';a.end_at=now;MOCK.sessions.unshift(a);MOCK.activeSession=null;}
  persistDemo();return {ok:true}
 }
 if(path==='/tasks'&&method==='POST'){if(!['founder','hr','lead'].includes(u.role))throw Error('Manager access required');MOCK.tasks.unshift({id:mkid(),title:String(body.title),details:String(body.details||''),assignee_id:body.assignee_id,client_id:body.client_id,status:'todo',priority:body.priority||'normal',due_date:body.due_date,estimated_min:Number(body.estimated_min)||60,created_at:now});persistDemo();return {ok:true}}
 if(path.startsWith('/tasks/')&&method==='PATCH'){let t=MOCK.tasks.find(x=>x.id===path.split('/')[2]);if(!t)throw Error('Unknown task');if(body.status==='done'&&!['founder','hr','lead'].includes(u.role))throw Error('Manager review required');t.status=body.status;persistDemo();return {ok:true}}
 if(path==='/employees'&&method==='POST'){if(!['founder','hr'].includes(u.role))throw Error('HR access required');if(MOCK.users.find(x=>x.username===body.username))throw Error('Username already exists');MOCK.users.push({id:mkid(),name:body.name,username:body.username,role:body.role||'employee',is_minor:body.is_minor?1:0,active:1,last_seen:0,force_reset:0});persistDemo();return {username:body.username,temporary_password:'DEMO-NO-REAL-PASSWORD',ok:true}}
 if(path.startsWith('/employees/')&&path.endsWith('/status')&&method==='PATCH'){if(!['founder','hr'].includes(u.role))throw Error('HR access required');let member=MOCK.users.find(x=>x.id===path.split('/')[2]);if(member&&member.id!==u.id)member.active=body.active?1:0;persistDemo();return {ok:true}}
 if(path==='/leave'&&method==='POST'){MOCK.leaves.unshift({id:mkid(),user_id:u.id,start_date:body.start_date,end_date:body.end_date,reason:body.reason,status:'pending',created_at:now});persistDemo();return {ok:true}}
 if(path.startsWith('/leave/')&&method==='PATCH'){let l=MOCK.leaves.find(x=>x.id===path.split('/')[2]);if(l)l.status=body.status;persistDemo();return {ok:true}}
 if(path==='/meetings'&&method==='POST'){MOCK.meetings.unshift({id:mkid(),topic:body.topic,objective:body.objective,starts_at:body.starts_at,owner_id:u.id,created_at:now});persistDemo();return {ok:true}}
 if(path==='/calls'&&method==='POST'){MOCK.calls.unshift({id:mkid(),user_id:u.id,client_id:body.client_id,status:body.status,notes:body.notes,logged_at:now});persistDemo();return {ok:true}}
 return {ok:true}
}

function showToast(m,err=false){const el=document.getElementById('toast');el.textContent=m;el.style.background=err?'#723044':'#214969';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3800)}
function formField(label,id,type='text',extra=''){return `<div class="field"><label class="label" for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" ${extra}></div>`}
function logo(){return '<div class="logo"><div class="logomark">TL</div><div>TEL <span style="color:#86aed6">/ OS</span><div style="font-size:9px;color:#8ea7cc;letter-spacing:.12em">MISSION CONTROL · BETA</div></div></div>'}
function renderLogin(){root.innerHTML=`<main class="auth"><div class="auth-visual"><div class="missionlabel">TEL / EXPERIMENTAL LAB · OPERATIONS</div><h2>Built for the<br><span>next frontier.</span></h2><p>A calmer way to manage missions, people and creative work. One command center. Clear accountability.</p><div class="planet"></div><div class="planet-grid"></div></div><section class="auth-card">${logo()}<h1>Work, with clarity.</h1><p class="muted">Secure employee access to TEL Operations. Your workday, assignments and approvals in one place.</p><form id="loginForm">${formField('Employee login','username','text','autocomplete="username" required')}${formField('Password','password','password','autocomplete="current-password" required')}<div id="loginError"></div><button class="btn primary full">Sign in to TEL OS →</button></form><div class="role-label">EXPLORE LIVE INTERACTIVE PREVIEW</div><div class="role-select"><button data-demo-role="founder">✦ Founder</button><button data-demo-role="hr">♙ HR</button><button data-demo-role="employee">☷ Employee</button></div><p class="footnote" style="margin-top:22px">Preview environment · Fictional sample data only · No passwords required for demo roles.</p></section></main>`}
function renderChangePassword(){root.innerHTML=`<main class="auth"><div class="auth-visual"><div class="missionlabel">TEL / EXPERIMENTAL LAB · OPERATIONS</div><h2>Built for the<br><span>next frontier.</span></h2><p>A calmer way to manage missions, people and creative work. One command center. Clear accountability.</p><div class="planet"></div><div class="planet-grid"></div></div><section class="auth-card">${logo()}<h1>Set a private password</h1><p class="muted">HR issued a one-time password. Choose a new password (12 characters minimum) before continuing.</p><form id="resetForm">${formField('Temporary password','old_password','password','required')}${formField('New password','new_password','password','minlength="12" required')}<button class="btn primary full">Activate my workspace</button></form><p class="footnote" style="margin-top:20px">Never send your permanent password over WhatsApp.</p><button class="btn small" id="signOutReset" style="margin-top:14px">Sign out</button></section></main>`}
function navItems(){return [{id:'overview',icon:'✦',title:'Mission control'},{id:'tasks',icon:'☷',title:'Assignments'},{id:'attendance',icon:'◷',title:'Attendance'},{id:'team',icon:'◎',title:'Crew status'},{id:'meetings',icon:'▣',title:'Meetings & calls'},{id:'leave',icon:'◇',title:'Student leave'},{id:'hr',icon:'♧',title:'HR command',hide:!hr()},{id:'policy',icon:'⚑',title:'Work policy'}]}
function layout(){const pages={overview:'Mission control',tasks:'Assignments',attendance:'Attendance',team:'Live team',meetings:'Meetings & calls',leave:'Student leave',hr:'HR control',policy:'Company policy'};root.innerHTML=`<div class="app"><aside class="sidebar" id="sidebar">${logo()}<div class="navgroup">Operations</div>${navItems().filter(x=>!x.hide).map(x=>`<button class="nav ${S.tab===x.id?'active':''}" data-tab="${x.id}"><span class="sym">${x.icon}</span>${x.title}</button>`).join('')}<div class="aside-footer"><span>◉ SYSTEM HEALTH</span><p>All mission systems operational</p><div class="mini-progress"><b></b></div></div><div class="profile-mini"><div class="avatar">${e(S.user?.name?.slice(0,1)||'T')}</div><div style="flex:1;min-width:0"><div class="profile-name">${e(S.user?.name)}</div><div class="profile-role">${e(role(S.user?.role))}</div></div><button class="btn small" data-act="logout" title="Log out">↪</button></div></aside><main class="main"><div class="topbar"><div><button class="btn small mobile-head" data-act="menu">☰ Menu</button><div class="eyebrow">EMPLOYEE OPERATIONS / TEL GROUP</div><h1>${pages[S.tab]}</h1></div><div class="topright"><span class="pill demo-pill">✦ INTERACTIVE PREVIEW</span><select id="demoRoleSwitch" class="quickrole" aria-label="Switch demo role"><option value="founder" ${S.user?.role==='founder'?'selected':''}>Founder view</option><option value="hr" ${S.user?.role==='hr'?'selected':''}>HR view</option><option value="lead" ${S.user?.role==='lead'?'selected':''}>Lead view</option><option value="employee" ${S.user?.role==='employee'?'selected':''}>Employee view</option></select><div class="avatar">${e(S.user?.name?.slice(0,1)||'T')}</div></div></div><section class="content" id="content"></section></main></div>`;paintContent()}
const card=(title,subtitle,body,right='')=>`<section class="card"><div class="section-head"><div><h2>${title}</h2>${subtitle?`<div class="subtitle">${subtitle}</div>`:''}</div>${right}</div>${body}</section>`;
const badge=(s)=>`<span class="tag ${s==='done'||s==='approved'||s==='Online'||s==='answered'?'green':s==='high'||s==='working'||s==='pending'?'amber':s==='missed'||s==='declined'||s==='Suspended'?'red':'dim'}">${e(s)}</span>`;
function kpi(title,value,hint,icon){return `<div class="card kpi"><i>${icon}</i><div class="klabel">${title}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function activeMs(){const d=S.data;let ms=d?.todayMs||0, a=d?.activeSession;if(a){if(a.state==='working')ms+=Math.max(0,Date.now()-a.start_at-(a.break_ms||0));else ms+=Math.max(0,a.break_started_at-a.start_at-(a.break_ms||0))}return Math.max(0,ms)}
function timerSection(){const d=S.data,a=d.activeSession,ms=activeMs(),pc=Math.min(100,ms/14400000*100);return card('Your work session','Target: up to 4 scheduled hours, with required breaks',`<div class="worktimer" id="workTime">${fmt(ms)}</div><div class="progress"><div id="workBar" style="width:${pc}%"></div></div><div class="buttonrow">${!a?'<button class="btn primary" data-act="clock-in">▶ Clock in</button>':a.state==='working'?'<button class="btn" data-act="clock-break">Ⅱ Take break</button><button class="btn primary" data-act="clock-out">■ Clock out</button>':'<button class="btn primary" data-act="clock-resume">▶ Resume</button><button class="btn" data-act="clock-out">■ Clock out</button>'}</div><p class="note">${a?'Current status: '+e(a.state)+'. ':'Not currently on duty. '}Attendance records approved work periods, not personal device activity.</p><div class="notice">For students under 18: no overtime or out-of-hours duties; take legally required rest breaks. Managers must approve your schedule.</div>`) }
function taskRow(t){const can=allowed()||t.assignee_id===S.user.id;return `<div class="task"><div><div class="title">${e(t.title)}</div><div class="meta">${e(client(t.client_id))} · ${e(name(t.assignee_id))} · Due ${e(t.due_date||'not set')} · ${e(t.priority)} priority</div>${t.details?`<div class="meta">${e(t.details)}</div>`:''}</div><div class="controls">${badge(t.status)} ${can?`<select data-task="${e(t.id)}" aria-label="Update task status" style="width:112px;padding:8px;font-size:11px"><option value="">Update</option>${['todo','working','review','done'].filter(s=>allowed()||s!=='done').map(s=>`<option>${s}</option>`).join('')}</select>`:''}</div></div>`}
function taskSection(short=false){const t=S.data.tasks;return card(short?'Priority assignments':'Client work & deliverables',short?'Task status updates help managers review progress':'Only designated managers can approve a final deliverable',`<div class="list">${(short?t.filter(x=>x.status!=='done').slice(0,4):t).map(taskRow).join('')||'<div class="empty">No assigned tasks. Ask your manager for a documented brief.</div>'}</div>`,allowed()?'<button class="btn small" data-modal="task">+ Assign task</button>':'')}
function overview(){const d=S.data,mine=d.tasks.filter(x=>x.assignee_id===S.user.id);return `<section class="mission-hero"><div class="hero-copy"><div class="hero-tag"><i></i> MISSION CONTROL / ${e(S.user.role.toUpperCase())} ACCESS</div><h2>Good to have you aboard,<br><em>${e(S.user.name.split(' ')[0])}.</em></h2><p>Every great mission starts with clear priorities. Check your assignments, log your work and keep the whole crew moving.</p><div class="hero-actions"><button class="btn primary" data-tab="tasks">Explore assignments ↗</button><button class="btn" data-tab="team">View crew status ◎</button></div></div><div class="hero-orb"></div><div class="orbit-tick">ORBIT / 44.02° &nbsp; ● SIGNAL LOCKED</div><div class="hero-system">TEL SPACE OPERATIONS &nbsp; / &nbsp; EST. 2026</div></section><div class="stats-line"><h3>Mission overview</h3><div class="system-right"><i></i> All systems nominal &nbsp; · &nbsp; Fictional demo data</div></div><div class="grid kpis">${kpi('Open assignments',mine.filter(x=>x.status!=='done').length,'Waiting on your next update','☷')}${kpi('Awaiting review',mine.filter(x=>x.status==='review').length,'Ready for approval','◇')}${kpi('Active crew',d.users.filter(online).length,'Last seen in the portal','◎')}${kpi('Your work today',fmt(activeMs()).slice(0,5),'Work time, excluding breaks','◷')}</div><div class="grid twocol">${timerSection()}${taskSection(true)}</div><div class="mission-console"><div class="console-icon">✧</div><div style="flex:1"><strong>Next checkpoint: a productive, balanced workday.</strong><p>School time is protected. Work sessions, deliverables and approvals are transparent and human-reviewed.</p></div><button class="btn small" data-tab="policy">View protocol ↗</button></div><div style="margin-top:18px">${card('Agency delivery pulse','Monitor approved work, not personal devices',`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:12px">${kpi('Approved tasks',d.tasks.filter(x=>x.status==='done').length,'Review completed','✓')}${kpi('Upcoming meetings',d.meetings.filter(x=>new Date(x.starts_at).getTime()>Date.now()).length,'Agenda-first','▣')}${kpi('Open leave requests',d.leaves.filter(x=>x.status==='pending').length,'HR review pending','◇')}</div>`)}</div>`}
function attendance(){const rows=S.data.sessions.slice().sort((a,b)=>b.start_at-a.start_at);return `<div class="grid twocol">${timerSection()}${card('How the timer works','Clearly recorded, no background surveillance',`<div class="steps">${[['1','Clock in','Begin a scheduled work block.'],['2','Take a break','Pause work time; required student breaks are protected.'],['3','Clock out','End the shift; time is added to the daily total.'],['4','Handover','Move completed work into review and notify the lead.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}</div><div style="margin-top:18px">${card('Recent attendance','Managers can review sessions; only your own attendance is shown to you',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Date</th><th>Clock in</th><th>Clock out</th><th>Work logged</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${e(name(s.user_id))}</td><td>${e(s.work_date)}</td><td>${time(s.start_at)}</td><td>${time(s.end_at)}</td><td>${fmt((s.end_at||Date.now())-s.start_at-(s.break_ms||0)-(s.state==='break'?Date.now()-s.break_started_at:0))}</td><td>${badge(s.state)}</td></tr>`).join('')||'<tr><td colspan="6">No work sessions yet.</td></tr>'}</tbody></table></div>`)}</div>`}
function taskPage(){return `<div class="callout"><span>📋</span><div><strong>Assignment rules</strong> · Every task has a deliverable, due date and owner. Employees submit work for review; leads approve the final result. Chat messages alone don't count as delivery.</div></div><div style="margin-top:18px">${taskSection()}</div>`}

function meetingsPage(){const d=S.data;return `<div class="grid twocol">${card('Scheduled meetings','Every meeting has a specific deliverable or decision',`<div class="list">${d.meetings.map(m=>`<div class="task"><div><div class="title">${e(m.topic)}</div><div class="meta">${e(m.objective)} · ${e(m.starts_at)} · Owner: ${e(name(m.owner_id))}</div></div>${badge('agenda set')}</div>`).join('')||'<div class="empty">No meetings scheduled</div>'}</div>`,allowed()?'<button class="btn small" data-modal="meeting">+ Schedule</button>':'')}${card('Work call register','Employees log official calls; no personal calls are recorded automatically',`<div class="list">${d.calls.slice(0,8).map(c=>`<div class="task"><div><div class="title">${e(name(c.user_id))} · ${e(client(c.client_id))}</div><div class="meta">${e(c.notes||'Official call')} · ${date(c.logged_at)} ${time(c.logged_at)}</div></div>${badge(c.status)}</div>`).join('')||'<div class="empty">No official calls logged</div>'}</div>`,'<button class="btn small" data-modal="call">+ Log call</button>')}</div>`}
function leavePage(){const d=S.data;return `${card('School & examination leave','School obligations are a legitimate scheduling consideration',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Dates</th><th>Reason</th><th>Status</th><th>HR action</th></tr></thead><tbody>${d.leaves.map(l=>`<tr><td>${e(name(l.user_id))}</td><td>${e(l.start_date)} to ${e(l.end_date)}</td><td>${e(l.reason)}</td><td>${badge(l.status)}</td><td>${hr()&&l.status==='pending'?`<button class="btn small" data-leave="${e(l.id)}" data-decision="approved">Approve</button><button class="btn small" data-leave="${e(l.id)}" data-decision="declined">Decline</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">No requests</td></tr>'}</tbody></table></div>`,'<button class="btn small" data-modal="leave">+ Request leave</button>')}<div class="notice">Three missed scheduled shifts without notice should create an HR case. TEL OS does not automatically suspend students for illness, exams, technical problems or emergencies.</div>`}
function hrPage(){if(!hr())return '<div class="empty">HR authorization required</div>';return `${card('Employee directory','HR provisions accounts, controls access, and privately shares one-time passwords',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Login</th><th>Role</th><th>Status</th><th>Control</th></tr></thead><tbody>${S.data.users.map(x=>`<tr><td><strong>${e(x.name)}</strong></td><td>${e(x.username)}</td><td>${e(role(x.role))}</td><td>${badge(x.active?'Active':'Suspended')}</td><td>${x.id===S.user.id?'You':`<button class="btn small ${x.active?'danger':''}" data-employee="${e(x.id)}" data-active="${x.active?0:1}">${x.active?'Suspend':'Reactivate'}</button>`}</td></tr>`).join('')}</tbody></table></div>`,'<button class="btn small primary" data-modal="employee">+ Create employee</button>')}<div class="grid twocol" style="margin-top:18px">${card('Accountability alerts','Rule-based alerts, not AI judgments',`<div class="steps">${S.data.tasks.filter(t=>t.due_date&&t.due_date<today()&&t.status!=='done').slice(0,7).map(t=>`<div class="step"><span>!</span><div><strong>${e(t.title)}</strong><p>Overdue · ${e(name(t.assignee_id))} · Manager must review actual circumstances</p></div></div>`).join('')||'<div class="empty">No overdue tasks detected</div>'}</div><p class="note">Absence alerts require published schedules and approved-leave checks before they can be automated.</p>`)}${card('HR protocols','Never share private employee data in the public repository',`<div class="steps">${[['✓','Onboarding','HR creates unique login + temporary password.'],['↺','Review','Confirm the circumstances before responding to missed shifts.'],['🔒','Suspension','Human-approved access control only; sessions are revoked.'],['♧','Student protection','No out-of-hours minor coverage; document approved leave.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}</div>`}
function policyPage(){return `${card('TEL · Company operating policy','Demo policy draft · Requires local legal review before adoption',`<div class="steps">${[['1','Scheduled four-hour target','Complete approved assignments within a lawful, student-compatible roster. Time includes meetings and official calls.'],['2','Formal work communication','Use TEL OS, assigned WhatsApp work channels and company email. No obligation to monitor personal messages.'],['3','Proof of delivery','Each task records assignee, deadline, work product and manager approval.'],['4','Respect for student time','Exam leave, illness, weekly rest and statutory break intervals are protected.'],['5','Three-shift HR review','Consecutive unexplained missed scheduled shifts trigger welfare outreach and a human review, not automatic punishment.'],['6','Emergency duty','₹500+ allowance under a written, bounded roster for consenting eligible adults only; no minor overtime.'],['7','Transparent oversight','Only workplace records are tracked: sign-in, tasks, official call logs and attendance. No covert device surveillance.'],['8','AI readiness','Rule-based flags are live. Third-party AI analysis, WhatsApp integration and automatic call collection are NOT enabled in this demo.']].map(x=>`<div class="step"><span>${x[0]}</span><div><strong>${x[1]}</strong><p>${x[2]}</p></div></div>`).join('')}</div>`)}`}
function paintContent(){const el=document.getElementById('content');if(!el||!S.data)return;const pages={overview,attendance,tasks:taskPage,team:teamPage,meetings:meetingsPage,leave:leavePage,hr:hrPage,policy:policyPage};el.innerHTML=(pages[S.tab]||overview)();tick()}
function tick(){const el=document.getElementById('workTime');if(el)el.textContent=fmt(activeMs());const bar=document.getElementById('workBar');if(bar)bar.style.width=Math.min(100,activeMs()/14400000*100)+'%'}
async function refresh(keep=true){try{const d=await api('/bootstrap');S.data=d;S.user=d.user;if(d.user.force_reset){renderChangePassword();return}if(!keep)S.tab='overview';layout()}catch(err){if(S.user)showToast(err.message,true)}}
function modal(title,content){document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h2>${title}</h2><button class="btn small" data-act="close-modal">✕ Close</button></div>${content}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function opts(list,field,label){return list.map(x=>`<option value="${e(x.id)}">${e(x[label])}</option>`).join('')}
function modalByType(type){let content='';if(type==='task')content=`<form id="taskForm"><div class="field"><label class="label">Deliverable name</label><input name="title" required maxlength="120" placeholder="e.g. Approved launch reel"></div><div class="field"><label class="label">Brief & quality criteria</label><textarea name="details" placeholder="Format, review process, output link..."></textarea></div><div class="formgrid"><div class="field"><label class="label">Employee</label><select name="assignee_id" required>${opts(S.data.users.filter(x=>x.active),'id','name')}</select></div><div class="field"><label class="label">Client</label><select name="client_id">${opts(S.data.clients,'id','name')}</select></div><div class="field"><label class="label">Due date</label><input type="date" name="due_date"></div><div class="field"><label class="label">Estimated minutes</label><input type="number" name="estimated_min" min="15" max="480" value="60"></div><div class="field"><label class="label">Priority</label><select name="priority"><option>normal</option><option>high</option><option>low</option></select></div></div><button class="btn primary full">Assign task</button></form>`;if(type==='employee')content=`<form id="employeeForm"><div class="field"><label class="label">Full name</label><input name="name" required></div><div class="field"><label class="label">Login username</label><input name="username" pattern="[a-zA-Z0-9._-]{3,60}" required></div><div class="field"><label class="label">Role</label><select name="role"><option value="employee">Employee</option><option value="lead">Team Lead</option><option value="hr">Human Resources</option>${S.user.role==='founder'?'<option value="founder">Founder</option>':''}</select></div><div class="field"><label><input type="checkbox" name="is_minor" checked style="width:auto"> Under 18 (student safeguards)</label></div><button class="btn primary full">Generate login + one-time password</button></form>`;if(type==='leave')content=`<form id="leaveForm"><div class="formgrid"><div class="field"><label class="label">From</label><input type="date" name="start_date" required></div><div class="field"><label class="label">To</label><input type="date" name="end_date" required></div></div><div class="field"><label class="label">Reason</label><textarea name="reason" required placeholder="Examinations, school, illness or personal commitment"></textarea></div><button class="btn primary full">Submit to HR</button></form>`;if(type==='meeting')content=`<form id="meetingForm"><div class="field"><label class="label">Meeting topic</label><input name="topic" required></div><div class="field"><label class="label">Specific goal / decision</label><textarea name="objective" required></textarea></div><div class="field"><label class="label">Date & time</label><input type="datetime-local" name="starts_at" required></div><button class="btn primary full">Schedule meeting</button></form>`;if(type==='call')content=`<form id="callForm"><div class="field"><label class="label">Client</label><select name="client_id">${opts(S.data.clients,'id','name')}</select></div><div class="field"><label class="label">Outcome</label><select name="status"><option value="answered">Answered</option><option value="returned">Returned call</option><option value="missed">Missed call</option></select></div><div class="field"><label class="label">Work notes</label><textarea name="notes" placeholder="Business-related summary; no private content"></textarea></div><button class="btn primary full">Record official call</button></form>`;modal(({task:'Assign client work',employee:'Provision new TEL account',leave:'Request student leave',meeting:'Set a goal-based meeting',call:'Log an official work call'})[type],content)}
document.addEventListener('click',async ev=>{let demo=ev.target.closest('[data-demo-role]');if(demo){const which=demo.dataset.demoRole,match=MOCK.users.find(x=>x.role===which&&x.active);if(match){await api('/login','POST',{username:match.username});S.user=match;await refresh(false)}return}let tab=ev.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;layout();document.getElementById('sidebar').classList.remove('open');return}let m=ev.target.closest('[data-modal]');if(m){modalByType(m.dataset.modal);return}let b=ev.target.closest('[data-act]');if(b){let action=b.dataset.act;try{if(action==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(action==='close-modal'){closeModal();return}if(action==='logout'||action==='signOutReset'){await api('/logout','POST',{});S.user=null;S.data=null;renderLogin();return}if(action.startsWith('clock-')){await api('/clock','POST',{action:action.slice(6)});await refresh();showToast('Attendance updated');return}}catch(ex){showToast(ex.message,true)}}let l=ev.target.closest('[data-leave]');if(l){try{await api('/leave/'+l.dataset.leave,'PATCH',{status:l.dataset.decision});await refresh();showToast('Leave decision saved')}catch(ex){showToast(ex.message,true)}}let emp=ev.target.closest('[data-employee]');if(emp){const active=emp.dataset.active==='1';if(!confirm(`HR review: ${active?'reactivate':'suspend'} this account?`))return;try{await api('/employees/'+emp.dataset.employee+'/status','PATCH',{active});await refresh();showToast('Employee access updated')}catch(ex){showToast(ex.message,true)}}});
document.addEventListener('change',async ev=>{if(ev.target.id==='demoRoleSwitch'){const role=ev.target.value;const match=MOCK.users.find(x=>x.role===role&&x.active);if(match){await api('/login','POST',{username:match.username});S.user=match;await refresh(false)}return}const t=ev.target.closest('[data-task]');if(!t||!t.value)return;try{await api('/tasks/'+t.dataset.task,'PATCH',{status:t.value});await refresh();showToast('Task status updated')}catch(ex){showToast(ex.message,true)}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!['loginForm','resetForm','taskForm','employeeForm','leaveForm','meetingForm','callForm'].includes(form.id))return;ev.preventDefault();const data=Object.fromEntries(new FormData(form).entries());try{let r;if(form.id==='loginForm'){r=await api('/login','POST',data);S.user=r.user;if(r.user.force_reset)renderChangePassword();else await refresh(false);return}if(form.id==='resetForm'){await api('/change-password','POST',data);showToast('New password saved');await refresh(false);return}if(form.id==='taskForm')r=await api('/tasks','POST',data);if(form.id==='employeeForm'){data.is_minor=form.querySelector('[name="is_minor"]').checked;r=await api('/employees','POST',data);modal('Employee credentials · show once',`<div class="success">Account created. Give these details privately to the employee.</div><label class="label">Username</label><p style="font-size:19px;font-weight:800">${e(r.username)}</p><label class="label">Temporary password</label><p style="font-family:monospace;font-size:17px;word-break:break-all">${e(r.temporary_password)}</p><p class="note">Password must be changed at first login. Never post these details in an open group or repository.</p><button class="btn primary" data-act="close-modal">Done</button>`);await refresh();return}if(form.id==='leaveForm')r=await api('/leave','POST',data);if(form.id==='meetingForm')r=await api('/meetings','POST',data);if(form.id==='callForm')r=await api('/calls','POST',data);closeModal();await refresh();showToast('Saved successfully')}catch(ex){if(form.id==='loginForm'){const el=document.getElementById('loginError');if(el)el.innerHTML=`<div class="error">${e(ex.message)}</div>`}else showToast(ex.message,true)}});
(async()=>{if(new URLSearchParams(location.search).has('dashboard')){MOCK.current='u-founder';persistDemo()}else{MOCK.current=null;persistDemo()}try{const r=await api('/me');S.user=r.user;if(r.user.force_reset)renderChangePassword();else await refresh(false)}catch{renderLogin()}})();
setInterval(()=>{tick();if(S.user&&!S.user.force_reset)api('/heartbeat','POST',{}).catch(()=>{})},45000);
setInterval(()=>{if(S.user&&!S.user.force_reset)refresh().catch(()=>{})},90000);
</script></body></html>
